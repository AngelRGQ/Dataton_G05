  <TalendProperties:Property xmi:id="_ZbgRYNi4EfGS4Oy_nGQk2w" id="_Zagy4Ni4EfGS4Oy_nGQk2w" label="ingesta_INEC_NBI_grupo5" purpose="Cargar los datos oficiales de pobreza por Necesidades Básicas Insatisfechas (NBI) del Censo 2022 en SingleStore para analizar la pobreza en las provincias, cantones y parroquias del Ecuador." description="Este Job permite leer y cargar en SingleStore los archivos de pobreza por Necesidades Básicas Insatisfechas (NBI) publicados por el INEC, correspondientes al Censo Ecuador 2022. Los datos incluyen información sobre hogares pobres, distribución territorial y componentes de las necesidades básicas insatisfechas. La información se utilizará para aplicar reglas de calidad, calcular tasas de pobreza y comparar los resultados entre provincias, cantones y parroquias, como parte del Datatón del Grupo 5." version="0.1" statusCode="" item="_ZbgRYti4EfGS4Oy_nGQk2w" displayName="ingesta_INEC_NBI_grupo5">
