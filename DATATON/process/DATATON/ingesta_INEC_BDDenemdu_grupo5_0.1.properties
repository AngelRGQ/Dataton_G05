  <TalendProperties:Property xmi:id="_yEs2sNiiEfGlBbYMxLBL7w" id="_yEkT0NiiEfGlBbYMxLBL7w" label="ingesta_INEC_BDDenemdu_grupo5" purpose="Cargar los datos de personas y viviendas de la ENEMDU Anual 2022 del INEC en SingleStore para apoyar el análisis de las condiciones socioeconómicas y la pobreza en Ecuador." description="Este Job permite leer y cargar en SingleStore los archivos de personas y viviendas de la Encuesta Nacional de Empleo, Desempleo y Subempleo (ENEMDU) Anual 2022 del INEC. La información será utilizada para analizar características como ingresos, empleo, educación, vivienda y acceso a servicios básicos. Los datos se conservarán inicialmente con sus códigos originales para posteriormente aplicar reglas de calidad, realizar transformaciones y complementar el análisis de pobreza del Datatón del Grupo 5." version="0.1" statusCode="" item="_yEs2stiiEfGlBbYMxLBL7w" displayName="ingesta_INEC_BDDenemdu_grupo5">
