  <TalendProperties:Property xmi:id="_HcbB4NoGEfGjVb1XdXSgUA" id="_HcD1gNoGEfGjVb1XdXSgUA" label="Analisis_INEC_NBI_10_2_pobreza_por_parroquia" purpose="Perfilar la calidad de la tabla de pobreza por NBI por parroquia del INEC, usada como referencia oficial para comparar el KPI de pobreza multidimensional." description="Análisis de la tabla INEC_NBI_10.1_pobreza_por_parroquia (fuente: INEC / datos.gob.ec, año 2022, registros, cargada en SingleStore, esquema raw).&#xD;&#xA;&#xD;&#xA;Objetivo: conocer el estado de los datos antes de usarlos como línea base en la comparación del KPI estrella (% de hogares en pobreza multidimensional por parroquia contra el NBI oficial).&#xD;&#xA;&#xD;&#xA;Qué se revisa:&#xD;&#xA;- Completitud: cantidad de nulos y vacíos en el código de cantón y en el indicador de pobreza por NBI.&#xD;&#xA;- Unicidad: un solo registro por cantón (sin duplicados en el código de cantón).&#xD;&#xA;- Formato: el código de cantón debe seguir el patrón de 4 dígitos del clasificador DPA.&#xD;&#xA;- Rango: el porcentaje de pobreza debe estar entre 0 y 100.&#xD;&#xA;- Cobertura: cantidad de cantones presentes frente a los 221 del clasificador.&#xD;&#xA;" version="0.1" statusCode="Draft" item="_HccQAdoGEfGjVb1XdXSgUA" displayName="Analisis_INEC_NBI_10.2_pobreza_por_parroquia">
