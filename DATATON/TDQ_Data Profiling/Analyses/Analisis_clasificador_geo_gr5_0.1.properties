  <TalendProperties:Property xmi:id="_5eITUNoLEfGjVb1XdXSgUA" id="_5dwf4NoLEfGjVb1XdXSgUA" label="Analisis_clasificador_geo_gr5" purpose="Evaluar la calidad de los datos del Clasificador Geográfico 2022 del INEC antes de usarlo en los análisis del Dataton." description="Análisis de profiling de la columna(s) del archivo Clasificador_Geografico_2022 (provincia, cantón, parroquia y sus códigos). Se calculan indicadores de calidad: conteo de filas, nulos, valores distintos, duplicados, longitud mínima/máxima y tabla de frecuencias. El objetivo es detectar códigos faltantes, duplicados o con formato inconsistente, y confirmar que el clasificador sirve como llave de unión por cantón y provincia con las demás fuentes del lago de datos." version="0.1" statusCode="Draft" item="_5eI6YdoLEfGjVb1XdXSgUA" displayName="Analisis_clasificador_geo_gr5">
